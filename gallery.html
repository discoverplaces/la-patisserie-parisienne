    body {
      margin: 0;
      font-family: "Times New Roman", serif;
      background: #F8F5F2;
      color: #2D2D2D;
      line-height: 1.8;
    }

    h1, h2 {
      color: #2F4156;
      font-weight: bold;
    }

    /* NAVBAR */

    .navbar {
      background: #2F4156;
    }

    .navbar-brand {
      color: white;
      font-size: 1.7rem;
      font-weight: bold;
    }

    .navbar-brand:hover {
      color: #E3B5A4;
    }

    .navbar-nav .nav-link {
      color: white;
      padding: .5rem 1rem;
      border-radius: .25rem;
      transition: .3s;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      background: #E3B5A4;
      color: #2F4156;
    }

    /* BANNER */

    .banner {
      height: 350px;
      background:
      linear-gradient(rgba(47,65,86,0.45),
      rgba(47,65,86,0.45)),
      url("images/gallery-banner.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .banner h1 {
      color: white;
      font-size: 4rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,.5);
    }

    /* GALLERY */

    .gallery-section {
      padding: 50px 15px;
    }

    .gallery-title {
      margin-bottom: 35px;
      border-bottom: 3px solid #2F4156;
      padding-bottom: 15px;
    }

    .img-thumbnail {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      padding: 5px;
      background: white;
      border: 1px solid #ddd;
      transition: .3s;
    }

    .img-thumbnail:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    /* BACK BUTTON */

    .back-btn {
      text-align: center;
      margin: 40px 0;
    }

    .back-btn a {
      display: inline-block;
      background: #C97C5D;
      color: white;
      padding: .6rem 1.2rem;
      text-decoration: none;
      border-radius: .25rem;
      transition: .3s;
      font-size: 1rem;
    }

    .back-btn a:hover {
      background: #E3B5A4;
      color: #2F4156;
    }

    /* CONTACT BUTTON */

.contact-btn {
  display: inline-block;
  background: #C97C5D;
  color: white;
  padding: 12px 28px;
  text-decoration: none;
  border-radius: 5px;
  transition: .3s;
  font-size: 1rem;
}

.contact-btn:hover {
  background: #E3B5A4;
  color: #2F4156;
}

    /* FOOTER */

    footer {
      background: #2F4156;
      padding: 20px;
    }

    footer p {
      margin: 8px 0;
      color: white;
      text-align: center;
      font-size: 1rem;
    }

    footer a {
      color: #E3B5A4;
      text-decoration: none;
    }

    footer a:hover {
      color: white;
    }

    @media (max-width: 767px) {
      .banner h1 {
        font-size: 2.5rem;
      }

      .img-thumbnail {
        height: 200px;

    }
